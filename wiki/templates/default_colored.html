<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <link rel="stylesheet" type="text/css" href="%root_path%%css%"> -->
    <link rel="stylesheet" href="/wiki/assets/style.css" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%root_path%%rss%">
    <link id="hljs-theme-light" rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/styles/default.min.css" />
    <link id="hljs-theme-dark" rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/styles/dracula.min.css" disabled />
    <!-- TikZJax fonts (for browser-rendered TikZ diagrams) -->
    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <title>%title%</title>
    <!-- MathJax config: on phone-width screens, break long display equations onto
         multiple lines instead of overflowing the page. Desktop and tablet keep the
         default rendering (empty config), so their layout is unchanged. Must run
         BEFORE the MathJax script below. -->
    <script>
        (function () {
            var isPhone = window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
            window.MathJax = {
                chtml: isPhone
                    ? { scale: 0.8, displayOverflow: 'linebreak', linebreaks: { inline: true } }
                    : {}
            };
        })();
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=%encoding%">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Theme variables. Light values live at :root; the dark theme
           (toggled by the theme button, script near the end of <body>)
           overrides them on html[data-theme="dark"]. --content-font-scale
           is the reading-size multiplier driven by the +/- buttons. */
        :root {
            --content-font-scale: 1;
            --page-bg-image: url('/wiki/vimwiki_html/Images/parchment.jpg');
            --page-bg-color: transparent;
            --text-color: #333;
            --muted-text: #555;
            --content-bg: rgba(255, 255, 255, 0.5);
            --link-color: #b5651d;
            --link-hover-color: #8a4a12;
            --breadcrumb-sep-color: #c08a5a;
            --breadcrumb-current-color: #1f3a5f;
            --border-accent: rgba(181, 101, 29, 0.35);
            --accent: #6b4f2a;
            --accent-strong: #1f1a15;
            --btn-icon-color: #4a4038;
            --btn-text-on-accent: #fff;
            --panel-bg: #fbf6e9;
            --panel-border: rgba(107, 79, 42, 0.3);
            --panel-border-soft: rgba(107, 79, 42, 0.25);
            --panel-border-faint: rgba(107, 79, 42, 0.2);
            --panel-hover: rgba(107, 79, 42, 0.12);
            --grip-color: rgba(107, 79, 42, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-color-strong: rgba(0, 0, 0, 0.35);
            --sidebar-bg: rgba(251, 246, 233, 0.75);
            --sidebar-link-color: #4a4038;
            --sidebar-active-bg: rgba(107, 79, 42, 0.14);
            --sidebar-active-color: #1f3a5f;
            --sidebar-hover-bg: rgba(107, 79, 42, 0.1);
            --sidebar-hover-color: #1f1a15;
            --lp-snippet-color: #444;
            --lp-thumb-bg: rgba(107, 79, 42, 0.08);
            --focus-ring: rgba(107, 79, 42, 0.45);
            --focus-ring-fade: rgba(107, 79, 42, 0);
        }
        html[data-theme="dark"] {
            --page-bg-image: none;
            --page-bg-color: #14110d;
            --text-color: #e6e0d4;
            --muted-text: #b5ab98;
            --content-bg: rgba(24, 21, 17, 0.82);
            --link-color: #e3a75e;
            --link-hover-color: #f2c187;
            --breadcrumb-sep-color: #a9825a;
            --breadcrumb-current-color: #f2c187;
            --border-accent: rgba(227, 167, 94, 0.35);
            --accent: #d3a76b;
            --accent-strong: #f5ead8;
            --btn-icon-color: #d8cfc0;
            --btn-text-on-accent: #1a1712;
            --panel-bg: #211c16;
            --panel-border: rgba(211, 167, 107, 0.35);
            --panel-border-soft: rgba(211, 167, 107, 0.28);
            --panel-border-faint: rgba(211, 167, 107, 0.22);
            --panel-hover: rgba(211, 167, 107, 0.16);
            --grip-color: rgba(211, 167, 107, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.55);
            --shadow-color-strong: rgba(0, 0, 0, 0.6);
            --sidebar-bg: rgba(33, 28, 22, 0.85);
            --sidebar-link-color: #d8cfc0;
            --sidebar-active-bg: rgba(211, 167, 107, 0.2);
            --sidebar-active-color: #f2c187;
            --sidebar-hover-bg: rgba(211, 167, 107, 0.14);
            --sidebar-hover-color: #f5ead8;
            --lp-snippet-color: #c9c0b0;
            --lp-thumb-bg: rgba(211, 167, 107, 0.12);
            --focus-ring: rgba(211, 167, 107, 0.5);
            --focus-ring-fade: rgba(211, 167, 107, 0);
        }
        /* TikZ diagrams are rendered as black-on-transparent SVG with no
           color hooks of their own, so under dark theme they're inverted
           back to light-on-dark rather than staying illegibly dark-on-dark. */
        html[data-theme="dark"] pre.tikz svg {
            filter: invert(0.92) hue-rotate(180deg);
        }
        body {
            /* Absolute, not '../Images/parchment.jpg': the relative form
               resolved to a different copy of the same image in every section
               folder, so the browser cached (and re-downloaded) it once per
               section. One canonical URL = fetched once for the whole site. */
            background-image: var(--page-bg-image);
            background-color: var(--page-bg-color);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: Arial, sans-serif;
            padding: 3cm;
            color: var(--text-color);
        }
        #content {
            color: var(--text-color);
            font-size: calc(20px * var(--content-font-scale));
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            background-color: var(--content-bg);
        }
        h1 { font-size: calc(28px * var(--content-font-scale)); }
        h2 { font-size: calc(24px * var(--content-font-scale)); }
        h3 { font-size: calc(20px * var(--content-font-scale)); }
        h4, h5, h6 { font-size: calc(18px * var(--content-font-scale)); }
        img {
            display: block;
            max-width: 100%;
            max-height: 500px;
            margin: 30px auto;
        }
        /* Image + caption (built from each image's alt text) */
        figure.img-figure {
            margin: 30px auto;
            text-align: center;
            max-width: 100%;
        }
        figure.img-figure img {
            margin: 0 auto 8px auto;   /* caption sits right under the image */
        }
        figure.img-figure figcaption {
            font-size: 15px;
            color: var(--muted-text);
            font-style: italic;
            line-height: 1.4;
        }
        /* Diagram blocks (Mermaid + TikZ): centered, no code-box background */
        pre.mermaid, pre.tikz {
            background: none;
            border: none;
            text-align: center;
        }
        #content svg {
            max-width: 100%;
            height: auto;
        }
        /* Breadcrumb trail */
        .breadcrumb {
            font-size: 19px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-accent);
            word-break: break-word;
        }
        .breadcrumb:empty { display: none; }
        .breadcrumb a { color: var(--link-color); text-decoration: none; }
        .breadcrumb a:hover { color: var(--link-hover-color); text-decoration: underline; }
        .breadcrumb .breadcrumb-sep { color: var(--breadcrumb-sep-color); margin: 0 8px; }
        .breadcrumb .breadcrumb-current { color: var(--breadcrumb-current-color); }
        /* TOC sidebar (Wikipedia-style). Built at runtime by the "TOC sidebar"
           script below, which pulls the vimwiki-generated "Contents" block
           out of the normal content flow and rebuilds it as a sibling of
           #content — outside its card/padding, in the freed-up margin to its
           left — rather than inside it. The script only ever runs on
           windows at least 901px wide (matching the media query below); on
           narrower/phone viewports it doesn't touch the page at all, so none
           of this CSS applies there either. */
        #toc-sidebar {
            position: relative; /* positioning context for the resize handles below */
            padding: 14px 16px;
            background: var(--sidebar-bg);
            border: 1px solid var(--panel-border-soft);
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
        }
        /* Once dragged at least once (see the drag-to-move script further
           down), the sidebar detaches from the sticky flex column into a
           freely-positioned floating panel, remembered across page loads. */
        #toc-sidebar.floating {
            position: fixed !important;
            z-index: 999;
            box-shadow: 0 6px 22px var(--shadow-color-strong);
        }
        /* PowerPoint/picture-style resize handles: small squares on the
           box's own right edge, rather than a strip elsewhere on the page.
           Only a horizontal (width) resize is offered — the box's height is
           content-driven with its own scrollbar, so there's nothing
           meaningful to drag vertically. Work identically whether the box
           is docked or floating, since #toc-sidebar establishes a
           positioning context in both states (sticky and fixed both do). */
        #toc-sidebar .toc-resize-handle {
            position: absolute;
            right: -6px;
            width: 12px;
            border-radius: 3px;
            background: var(--accent);
            border: 2px solid var(--panel-bg);
            cursor: ew-resize;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            opacity: 0.8;
            z-index: 5;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        #toc-sidebar .toc-resize-handle:hover,
        #toc-sidebar .toc-resize-handle:focus-visible,
        #toc-sidebar .toc-resize-handle.dragging {
            opacity: 1;
            transform: scale(1.15);
        }
        #toc-sidebar .toc-resize-handle.corner {
            bottom: -6px;
            height: 12px;
        }
        #toc-sidebar .toc-resize-handle.edge {
            top: 50%;
            height: 28px;
            margin-top: -14px;
        }
        #toc-sidebar .toc-sidebar-title {
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--accent);
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--panel-border-soft);
            cursor: grab;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        #toc-sidebar .toc-sidebar-title:active,
        #toc-sidebar .toc-sidebar-title.dragging-title {
            cursor: grabbing;
        }
        body.toc-dragging-position { cursor: grabbing; user-select: none; }
        #toc-sidebar .toc-sidebar-list,
        #toc-sidebar .toc-sidebar-list ul {
            list-style: none;
            margin: 0;
            padding-left: 0;
        }
        #toc-sidebar .toc-sidebar-list ul { padding-left: 16px; }
        #toc-sidebar .toc-sidebar-list li { margin: 3px 0; }
        #toc-sidebar .toc-sidebar-list a {
            display: block;
            color: var(--sidebar-link-color);
            text-decoration: none;
            padding: 3px 8px;
            border-left: 3px solid transparent;
            border-radius: 3px;
        }
        #toc-sidebar .toc-sidebar-list a:hover {
            background: var(--sidebar-hover-bg);
            color: var(--sidebar-hover-color);
        }
        #toc-sidebar .toc-sidebar-list a.active {
            border-left-color: var(--accent);
            background: var(--sidebar-active-bg);
            color: var(--sidebar-active-color);
            font-weight: bold;
        }
        @media (min-width: 901px) {
            /* #page-shell takes over #content's old page-centering role.
               Widened past the original 1200px so the content column can
               get back close to its original reading width even with the
               240px sidebar added alongside it — on a wide screen this
               shell sits further out toward both edges (sidebar moves left,
               content gets wider) rather than squeezing content down.
               justify-content:center keeps whatever's currently visible
               centered within that shell — normally a no-op, since #content
               already fills all remaining space there, but it's what makes
               the layout re-center symmetrically (rather than sitting
               flush-left with a dead gap on the right) once the sidebar and
               its gap strip are hidden via the Contents toggle button. */
            #page-shell {
                max-width: 1500px;
                margin: 0 auto;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                gap: 0; /* the draggable #toc-resizer below provides the gutter instead */
            }
            /* The sidebar's own padding/border already separate it from the
               viewport edge, so the full 3cm reading margin body normally
               carries is more than this side needs — added by the sidebar
               script via document.body.classList.add('has-toc-sidebar')
               once it confirms a page actually has a Contents block. Left
               only: the article's right-hand margin is untouched. Scoped to
               this breakpoint so it automatically reverts to the normal 3cm
               if the window narrows into the mobile layout. */
            body.has-toc-sidebar {
                padding-left: 1cm;
            }
            #page-shell > #content {
                margin: 0;
                max-width: none;
                flex: 1 1 auto;
                min-width: 0; /* let wide equations/code wrap instead of forcing the column wider */
            }
            #toc-sidebar {
                flex: 0 0 240px;
                max-width: 240px;
                position: sticky;
                top: 20px;
                max-height: calc(100vh - 40px);
                overflow-y: auto;
            }
            /* Draggable dividers, built by the same script that builds the
               sidebar: one between the sidebar and the article, one after
               the article so its right-hand margin is adjustable too. Both
               sticky so they're reachable at any scroll position. */
            #toc-resizer, #content-resizer {
                flex: 0 0 24px;
                max-width: 24px;
                cursor: col-resize;
                display: flex;
                align-items: center;
                touch-action: none;
                -webkit-tap-highlight-color: transparent;
                position: sticky;
                top: 20px;
                height: calc(100vh - 40px);
                outline: none;
            }
            /* #toc-resizer's own width grows to become the gap itself (see
               the script), so its grip must stay pinned to the edge nearest
               #content rather than centering — centered, it would visually
               drift away from the actual content boundary as the gap grows.
               #content-resizer's box is always a fixed 24px regardless of
               drag, so centering there was never actually a problem, but
               it's pinned the same way for a consistent look either side. */
            #toc-resizer { justify-content: flex-end; }
            #content-resizer { justify-content: flex-start; }
            #toc-resizer .toc-resizer-grip,
            #content-resizer .toc-resizer-grip {
                width: 4px;
                height: 48px;
                border-radius: 4px;
                background: var(--grip-color);
                transition: background 0.15s ease, height 0.15s ease;
            }
            #toc-resizer:hover .toc-resizer-grip,
            #toc-resizer.dragging .toc-resizer-grip,
            #toc-resizer:focus-visible .toc-resizer-grip,
            #content-resizer:hover .toc-resizer-grip,
            #content-resizer.dragging .toc-resizer-grip,
            #content-resizer:focus-visible .toc-resizer-grip {
                background: var(--accent);
                height: 72px;
            }
        }
        /* Applied to <body> only while actively dragging the resizer, so the
           cursor/no-select behavior holds even if the pointer strays off the
           thin handle mid-drag. */
        body.toc-resizing { cursor: col-resize; user-select: none; }
        /* Read mode: hides the site-wide tool icons in the top-right stack —
           everything except the read-mode toggle itself, so there's always a
           way back out — on every screen size.
           NOT hidden: the bottom-right .floating-btns stack (back / back-to-top
           / ask-this-page). Those are per-page reading aids rather than chrome;
           losing them mid-article is exactly when they're most wanted.
           Also deliberately untouched: #content, #toc-sidebar, and its
           resizers — read mode only hides chrome, the article layout itself
           stays exactly as it was.
           Hiding happens in two phases so the icons fade instead of blinking
           out mid-scroll: .focus-fading makes them transparent while they're
           still laid out, then .read-mode removes them for real once the
           transition has finished. The script below swaps the classes; its
           FADE_MS must match the 0.22s duration used here.
           #toc-toggle is the phone-only Contents button — it sits outside
           both button stacks, so it has to be named explicitly. */

        /* Every selector below is deliberately over-qualified with `body`.
           These rules sit earlier in this stylesheet than the .top-right-btns
           / #toc-toggle rules they need to beat, so they can't rely on
           source order and win on specificity instead. The color/background
           transitions are repeated here because this rule replaces, rather
           than adds to, the one on .top-right-btns button. */
        body .top-right-btns > button,
        body .top-right-btns > a,
        body #toc-toggle {
            transition: opacity 0.22s ease, transform 0.22s ease,
                        color 0.15s ease, background-color 0.15s ease;
        }
        body.focus-fading .top-right-btns > *:not(#btn-read-mode),
        body.focus-fading #toc-toggle {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }
        body.read-mode .top-right-btns > *:not(#btn-read-mode),
        body.read-mode #toc-toggle {
            display: none;
        }
        #btn-read-mode[aria-pressed="true"] {
            color: var(--accent-strong);
            background: var(--panel-hover);
        }
        /* Two ripples out of the eye as focus mode engages — it's the only
           control left on screen, so it's the one the reader has to find. */
        @keyframes focus-eye-pulse {
            0%   { box-shadow: 0 0 0 0 var(--focus-ring); }
            100% { box-shadow: 0 0 0 16px var(--focus-ring-fade); }
        }
        #btn-read-mode.focus-pulse { animation: focus-eye-pulse 0.9s ease-out 2; }
        /* Toast: says *why* the buttons just disappeared, plus a way out for
           readers who don't connect it to the eye. Identical on phone and
           desktop; shown once per page load, not on every re-engage. */
        #focus-toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100vw - 32px);
            padding: 9px 10px 9px 16px;
            border: 1px solid var(--panel-border);
            border-radius: 999px;
            background: var(--panel-bg);
            color: var(--text-color);
            font: 14px/1.3 Arial, sans-serif;
            box-shadow: 0 6px 22px var(--shadow-color-strong);
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 1600;   /* above the top-right stack (1500) and the mobile TOC panel (1051) */
        }
        #focus-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #focus-toast .focus-toast-btn {
            flex: 0 0 auto;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: var(--btn-text-on-accent);
            font: bold 13px/1 Arial, sans-serif;
            padding: 7px 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        @media (max-width: 600px) {
            #focus-toast { bottom: 16px; font-size: 13px; padding: 8px 8px 8px 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
            body .top-right-btns > button,
            body .top-right-btns > a,
            body #toc-toggle,
            #focus-toast { transition: none; }
            #btn-read-mode.focus-pulse { animation: none; }
        }
        /* Mobile Contents toggle + glass panel. Built by a separate,
           self-contained script (own copy of the TOC-detection logic) that
           only ever runs below the same 900px point where the desktop
           sidebar script bails out — the two never run on the same page
           load, so there's no interaction between them to worry about. */
        @media (max-width: 900px) {
            #toc-toggle {
                position: fixed;
                left: 24px;
                bottom: 24px;
                width: 52px;
                height: 52px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: var(--btn-text-on-accent);
                box-shadow: 0 2px 10px var(--shadow-color);
                z-index: 1052;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                transition: transform 0.15s ease;
            }
            #toc-toggle:active { transform: scale(0.92); }
            #toc-toggle svg { width: 26px; height: 26px; display: block; }
            #toc-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.25);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
                z-index: 1050;
            }
            #toc-overlay.open { opacity: 1; pointer-events: auto; }
            /* The actual "glass": translucent + blurred backdrop so the
               article text is still dimly visible (and scroll position
               legible) behind the panel while it's open. */
            #toc-panel {
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: 12px;
                max-height: 70vh;
                display: flex;
                flex-direction: column;
                background: rgba(251, 246, 233, 0.55);
                -webkit-backdrop-filter: blur(16px) saturate(160%);
                backdrop-filter: blur(16px) saturate(160%);
                border: 1px solid rgba(255, 255, 255, 0.4);
                border-radius: 16px;
                box-shadow: 0 10px 40px var(--shadow-color-strong);
                z-index: 1051;
                overflow: hidden;
                transform: translateY(16px) scale(0.98);
                opacity: 0;
                pointer-events: none;
                transition: transform 0.22s ease, opacity 0.22s ease;
            }
            #toc-panel.open {
                transform: translateY(0) scale(1);
                opacity: 1;
                pointer-events: auto;
            }
            html[data-theme="dark"] #toc-panel {
                background: rgba(33, 28, 22, 0.5);
                border-color: rgba(255, 255, 255, 0.12);
            }
            #toc-panel .toc-panel-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 16px 10px 16px;
                font-weight: bold;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--accent);
                border-bottom: 1px solid var(--panel-border-soft);
                flex: 0 0 auto;
            }
            #toc-panel .toc-panel-close {
                border: none;
                background: none;
                color: inherit;
                font-size: 22px;
                line-height: 1;
                padding: 4px 6px;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
            }
            #toc-panel .toc-panel-body {
                overflow-y: auto;
                padding: 8px 10px 14px 10px;
                font-size: 16px;
            }
            #toc-panel .toc-panel-body ul,
            #toc-panel .toc-panel-body ul ul {
                list-style: none;
                margin: 0;
                padding-left: 0;
            }
            #toc-panel .toc-panel-body ul ul { padding-left: 18px; }
            #toc-panel .toc-panel-body li { margin: 2px 0; }
            #toc-panel .toc-panel-body a {
                display: block;
                color: var(--sidebar-link-color);
                text-decoration: none;
                padding: 9px 10px;
                border-radius: 8px;
            }
            #toc-panel .toc-panel-body a:active { background: var(--panel-hover); }
        }
        /* Floating navigation buttons (ask this page + go back + scroll to top) */
        .floating-btns {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
        }
        .floating-btns button {
            width: 48px;
            height: 48px;
            border: none;

        /* Top-right button stack: site-wide tools (translate + search), kept

           supports middle-click/ctrl-click to open in a new tab — but gets
           the exact same box treatment as the icon buttons around it. */
        .top-right-btns button,
        .top-right-btns a {
            width: 48px;
            height: 48px;

            align-items: center;

           they need their own font sizing on top of the shared button box. */

        @media (max-width: 600px) {
            .floating-btns { right: 14px; bottom: 14px; }
            .floating-btns button { width: 44px; height: 44px; font-size: 20px; line-height: 44px; }
            .top-right-btns { top: 12px; right: 14px; gap: 4px; }

        /* Mobile Styles */

            mjx-container[display="true"] {

        /* Google Translate: the widget itself stays hidden. We drive it entirely
           through our own globe button + language panel below. Suppress every
           bit of Google's own chrome in all cases — the "Translated to … /
           Show original" top banner, the floating balloon, the feedback tab,
           and the "suggest a better translation" hover tooltip. None of it

<body>

    <div class="top-right-btns">

    <!-- Breadcrumb trail: the actual navigation chain the visitor clicked
         through, in order (link1 > link2 > ... > current), NOT the folder path.
         The chain is stored per-tab in sessionStorage: each page appends itself
         when reached via a new link, and truncates back to itself when revisited
         (e.g. clicking an earlier crumb or using the back button). Home is
         always the root. The label prefers the page's own <h1>. -->
    <script>
    (function () {
        var nav = document.getElementById('breadcrumb');
        if (!nav) return;

        var KEY = 'wikiBreadcrumbTrail';
        var path = window.location.pathname;

        function pageLabel() {
            var h1 = document.querySelector('#content h1');
            var t = h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : '';
            if (t) return t;
            t = (document.title || '').replace(/_+/g, ' ').trim();
            if (t && t.toLowerCase() !== 'index') return t;
            var segs = path.split('/').filter(Boolean).map(function (s) {
                try { return decodeURIComponent(s); } catch (e) { return s; }
            });
            var last = segs.pop() || '';
            if (/^index\.html?$/i.test(last)) last = segs.pop() || 'index';
            return last.replace(/\.html?$/i, '').replace(/_+/g, ' ').trim() || 'Page';
        }

        var current = { href: path, label: pageLabel() };

        // Load the existing chain for this tab.
        var trail = [];
        try { trail = JSON.parse(sessionStorage.getItem(KEY)) || []; } catch (e) { trail = []; }
        if (!Array.isArray(trail)) trail = [];

        // If this page is already in the chain (visitor clicked an earlier crumb
        // or hit back), cut the chain back to it. Otherwise extend the chain.
        var found = -1;
        for (var i = 0; i < trail.length; i++) {
            if (trail[i] && trail[i].href === current.href) { found = i; break; }
        }
        if (found !== -1) {
            trail = trail.slice(0, found + 1);
            trail[found] = current;            // refresh the label
        } else {
            trail.push(current);
        }

        try { sessionStorage.setItem(KEY, JSON.stringify(trail)); } catch (e) {}

        function addLink(href, text) {
            var a = document.createElement('a');
            a.href = href;
            a.textContent = text;
            nav.appendChild(a);
            var sep = document.createElement('span');
            sep.className = 'breadcrumb-sep';
            sep.textContent = '\u203A';
            nav.appendChild(sep);
        }

        // Home is always the root of the chain.
        addLink('/index.html', 'Home');

        // Every page in the chain except the current one is a clickable link.
        for (var j = 0; j < trail.length - 1; j++) {
            addLink(trail[j].href, trail[j].label);
        }

        var cur = document.createElement('span');
        cur.className = 'breadcrumb-current';
        cur.setAttribute('aria-current', 'page');
        cur.textContent = trail.length ? trail[trail.length - 1].label : current.label;
        nav.appendChild(cur);
    })();
    </script>

    <!-- Floating buttons: back = previous page, top = smooth-scroll to top of this page -->
    <script>
    (function () {
        var back = document.getElementById('btn-back');
        var top = document.getElementById('btn-top');
        if (back) {
            back.addEventListener('click', function () { window.history.back(); });
            if (window.history.length <= 1) back.style.display = 'none'; // nothing to go back to
        }
        if (top) {
            top.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            var onScroll = function () {
                top.style.display = (window.pageYOffset > 200) ? 'block' : 'none';
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }
    })();
    </script>

        }

        function renderList(filter) {

            var active = currentLang();

            LANGS.forEach(function (pair) {
                var code = pair[0], name = pair[1];
                if (f && name.toLowerCase().indexOf(f) === -1) return;
                var b = document.createElement('button');

        function setLanguage(code) {
            try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
            panel.classList.remove('open');
            applyLanguage(code);
        }

        function applyLanguage(code) {
            if (code === 'en') {
                // Reset to the original English text.
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + location.hostname + ';';
                if (document.querySelector('select.goog-te-combo')) location.reload();

                        combo.value = code;
                        combo.dispatchEvent(new Event('change'));

                }
            })();
        }

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var opening = !panel.classList.contains('open');
            panel.classList.toggle('open', opening);
            if (opening) {
                search.value = '';
                renderList('');
                search.focus();
            }
        });
        document.addEventListener('click', function (e) {
            if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
                panel.classList.remove('open');
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') panel.classList.remove('open');
        });
        search.addEventListener('input', function () { renderList(search.value); });

        // Keep the whole site translated as the visitor moves between pages.
        var saved = currentLang();

    <!-- Text size + theme: both run on every viewport (including phones),
         unlike the TOC-sidebar script further down, which only touches
         desktop-width pages. Text size drives --content-font-scale (used by
