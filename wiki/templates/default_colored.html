         html[data-theme="dark"] and swaps in the dark highlight.js
         stylesheet to match. Both choices persist in localStorage, same
         pattern as the language picker above. -->
    <script>
    (function () {
        var FONT_KEY = 'wikiFontScale';
        var FONT_MIN = 0.75, FONT_MAX = 1.6, FONT_STEP = 0.1;
        var btnDec = document.getElementById('btn-font-dec');
        var btnInc = document.getElementById('btn-font-inc');
        var scale = 1;
        try {
            var savedScale = parseFloat(localStorage.getItem(FONT_KEY));
            if (!isNaN(savedScale)) scale = savedScale;
        } catch (e) {}
        function applyScale(s) {
            scale = Math.max(FONT_MIN, Math.min(FONT_MAX, s));
            document.documentElement.style.setProperty('--content-font-scale', scale.toFixed(2));
            try { localStorage.setItem(FONT_KEY, scale.toFixed(2)); } catch (e) {}
        }
        applyScale(scale);
        if (btnDec) btnDec.addEventListener('click', function () { applyScale(scale - FONT_STEP); });
        if (btnInc) btnInc.addEventListener('click', function () { applyScale(scale + FONT_STEP); });
    })();
    (function () {
        var THEME_KEY = 'wikiTheme';
        var SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
        var MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
        var btnTheme = document.getElementById('btn-theme');
        var hljsDark = document.getElementById('hljs-theme-dark');
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            if (btnTheme) {
                btnTheme.innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
                var label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
                btnTheme.title = label;
                btnTheme.setAttribute('aria-label', label);
            }
            if (hljsDark) hljsDark.disabled = (theme !== 'dark');
            try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
        }
        var savedTheme = 'light';
        try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (e) {}
        applyTheme(savedTheme);
        if (btnTheme) {
            btnTheme.addEventListener('click', function () {
                applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            });
        }
    })();
    (function () {
        var READ_MODE_KEY = 'wikiReadMode';
        var btn = document.getElementById('btn-read-mode');
        if (!btn) return;

        var FADE_MS  = 220;   // must match the .focus-fading transition in the <style> block
        var ENTER_AT = 320;   // px down the page before focus mode may engage on its own
        var EXIT_AT  = 80;    // px: getting back this close to the top releases it again
        var MIN_DOWN = 120;   // px of uninterrupted DOWNWARD scrolling required first, so a
                              // stray flick doesn't trigger it
        var MAX_JUMP = 400;   // a single scroll event bigger than this is a jump (TOC link,
                              // back-navigation restore), not reading — doesn't count

        var readOn = false;          // authoritative state; the body classes are mid-transition sometimes
        var autoEngaged = false;     // on because of scrolling, not because of a click
        var suppressed = false;      // reader switched it off by hand — don't fight them until
                                     // they're back at the top of the page
        var toastShown = false;      // the explanation is shown once per page load, not every re-engage
        var fadeTimer = null, toastTimer = null, toast = null;

        function pulse() {
            btn.classList.remove('focus-pulse');
            void btn.offsetWidth;    // forces a reflow so re-adding actually restarts the animation
            btn.classList.add('focus-pulse');
        }

        function ensureToast() {
            if (toast) return toast;
            toast = document.createElement('div');
            toast.id = 'focus-toast';
            toast.setAttribute('role', 'status');
            toast.setAttribute('aria-live', 'polite');
            var msg = document.createElement('span');
            msg.textContent = 'Reading mode — page buttons hidden';
            var show = document.createElement('button');
            show.type = 'button';
            show.className = 'focus-toast-btn';
            show.textContent = 'Show';
            show.addEventListener('click', function () {
                suppressed = true;   // an explicit "no" — same weight as clicking the eye
                autoEngaged = false;
                applyReadMode(false);
            });
            toast.appendChild(msg);
            toast.appendChild(show);
            document.body.appendChild(toast);
            return toast;
        }
        function showToast() {
            var t = ensureToast();
            clearTimeout(toastTimer);
            requestAnimationFrame(function () { t.classList.add('visible'); });
            toastTimer = setTimeout(hideToast, 2800);
        }
        function hideToast() {
            clearTimeout(toastTimer);
            if (toast) toast.classList.remove('visible');
        }

        function setChrome(on, animate) {
            clearTimeout(fadeTimer);
            if (!animate) {                                        // page load: no fade, just the end state
                document.body.classList.remove('focus-fading');
                document.body.classList.toggle('read-mode', on);
                return;
            }
            if (on) {
                document.body.classList.add('focus-fading');       // fade out, still laid out
                fadeTimer = setTimeout(function () {
                    document.body.classList.add('read-mode');      // now actually gone
                    document.body.classList.remove('focus-fading');
                }, FADE_MS);
            } else {
                document.body.classList.remove('read-mode');       // back in the layout...
                document.body.classList.add('focus-fading');       // ...but still transparent
                requestAnimationFrame(function () {                // two frames: guarantees the
                    requestAnimationFrame(function () {            // browser has painted the
                        document.body.classList.remove('focus-fading');  // transparent state first
                    });
                });
            }
        }

        function applyReadMode(on, opts) {
            opts = opts || {};
            readOn = on;
            setChrome(on, opts.animate !== false);
            var label = on ? 'Exit read mode' : 'Read mode';
            btn.title = label;
            btn.setAttribute('aria-label', label);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            if (on && opts.announce) {
                pulse();
                if (!toastShown) { toastShown = true; showToast(); }
            }
            if (!on) hideToast();
        }

        // Focus mode is per-page-load: every page starts with its chrome
        // visible, and gets hidden either by the scroll watcher below or by a
        // click. Nothing is restored from storage, so a page can never open
        // already hidden — which is what a stale saved 'on' used to cause
        // (the pre-scroll version of this script persisted the state on every
        // call, including page load, so one click stuck forever). The old key
        // is cleared on sight so existing visitors self-heal on first load.
        try { localStorage.removeItem(READ_MODE_KEY); } catch (e) {}
        applyReadMode(false, { animate: false });

        btn.addEventListener('click', function () {
            var turningOn = !readOn;
            suppressed = !turningOn;   // turned it off by hand -> stay off until back at the top
            autoEngaged = false;       // from here on it's the reader's, not the scroll watcher's
            applyReadMode(turningOn, { announce: turningOn });
            // Deliberately does NOT scroll anywhere. The original handler jumped
            // to the top on switching read mode on, which was harmless when the
            // button was the only way in; now that focus mode engages mid-scroll
            // on its own, toggling it must never move the reader off the line
            // they're on. The "back to top" arrow is still there for that.
        });

        // ---- Scroll watcher: engage focus mode once the reader is clearly
        // reading, release it once they're clearly done. Runs on every viewport,
        // phones included. It only ever turns OFF what it itself turned on, so a
        // saved read-mode preference (or a click) is never undone by scrolling.
        var lastY = window.pageYOffset, downRun = 0;
        window.addEventListener('scroll', function () {
            var y = window.pageYOffset;
            var dy = y - lastY;
            lastY = y;
            if (dy > MAX_JUMP) downRun = 0;                        // jumped, didn't read — start over
            else if (dy > 0) downRun += dy;
            else if (dy < 0) downRun = 0;                          // any upward move restarts the run

            if (y <= EXIT_AT) {
                suppressed = false;                                // back at the top: re-arm
                if (autoEngaged && readOn) {
                    autoEngaged = false;
                    applyReadMode(false);
                }
                return;
            }
            if (!readOn && !suppressed && y >= ENTER_AT && downRun >= MIN_DOWN) {
                autoEngaged = true;
                applyReadMode(true, { announce: true });
            }
        }, { passive: true });
    })();
    </script>

    <!-- Images: (1) rewrite baked-in local export paths to their web location and
         trim stray spaces, (2) upgrade http:// -> https://, (3) add a caption under
         each image using its alt text. Images with no alt are left uncaptioned.
         NOTE: the image FILES must exist on the server at the mapped location
         (e.g. /wiki/vimwiki_html/Blogs/cric/) — upload that folder. -->
    <script>
    (function () {
        var LOCAL_ANCHOR = '/vimwiki/';
        var WEB_ROOT = '/wiki/vimwiki_html/';
        document.querySelectorAll('#content img').forEach(function (img) {
            // 1) normalise the src
            var raw = img.getAttribute('src');
            if (raw) {
                var s = raw.trim();
                var i = s.indexOf(LOCAL_ANCHOR);
                if (i !== -1) s = WEB_ROOT + s.slice(i + LOCAL_ANCHOR.length);
                if (/^http:\/\//i.test(s)) s = s.replace(/^http:\/\//i, 'https://');
                if (s !== raw) img.setAttribute('src', s);
            }
            // 2) defer offscreen images: on a long photo post the browser
            //    would otherwise start fetching every image at once.
            if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
            img.setAttribute('decoding', 'async');
            // 3) caption from alt text
            var alt = (img.getAttribute('alt') || '').trim();
            if (!alt) return;
            var parent = img.parentNode;
            if (!parent || parent.tagName === 'FIGURE') return;
            var fig = document.createElement('figure');
            fig.className = 'img-figure';
            var cap = document.createElement('figcaption');
            cap.textContent = alt;
            parent.insertBefore(fig, img);
            fig.appendChild(img);
            fig.appendChild(cap);
            // tidy a <br> left immediately after the image
            var nx = fig.nextSibling;
            if (nx && nx.nodeType === 1 && nx.tagName === 'BR') nx.parentNode.removeChild(nx);
        });
    })();
    </script>

    <!-- Hover preview cards for internal links, like Wikipedia's page previews.
         Hovering (or focusing) a same-site link to another .html page fetches
         that page, and if — and only if — it actually exists (HTTP 200), shows
         its title, first paragraph, and first image in a small card near the
         link. Broken/nonexistent links are left alone: nothing is shown. -->
    <script>
    (function () {
        var content = document.getElementById('content');
        if (!content) return;

        var LOCAL_ANCHOR = '/vimwiki/';
        var WEB_ROOT = '/wiki/vimwiki_html/';
        function fixImgSrc(src) {
            if (!src) return src;
            var s = src.trim();
            var i = s.indexOf(LOCAL_ANCHOR);
            if (i !== -1) s = WEB_ROOT + s.slice(i + LOCAL_ANCHOR.length);
            if (/^http:\/\//i.test(s)) s = s.replace(/^http:\/\//i, 'https://');
            return s;
        }

        var card = document.createElement('div');
        card.className = 'link-preview-card';
        document.body.appendChild(card);

        var cache = {};   // resolved URL -> {title, snippet, thumb} | 'missing'
        var showTimer = null;
        var hideTimer = null;
        var activeKey = null;

        function stripHash(href) {
            var i = href.indexOf('#');
            return i === -1 ? href : href.slice(0, i);
        }

        function extract(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var target = doc.getElementById('content');
            if (!target) return null;
            var h1 = target.querySelector('h1');
            var title = h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : (doc.title || '').trim();
            var snippet = '';
            var ps = target.querySelectorAll('p');
            for (var i = 0; i < ps.length; i++) {
                var t = ps[i].textContent.replace(/\s+/g, ' ').trim();
                if (t.length > 20) { snippet = t; break; }
            }
            if (snippet.length > 220) snippet = snippet.slice(0, 217).trim() + '…';
            var img = target.querySelector('img');
            var thumb = img ? fixImgSrc(img.getAttribute('src')) : null;
            return { title: title || 'Untitled', snippet: snippet, thumb: thumb };
        }

        function render(data) {
            var html = '';
            if (data.thumb) html += '<img class="lp-thumb" src="' + data.thumb + '" alt="">';
            html += '<div class="lp-body"><div class="lp-title"></div><p class="lp-snippet"></p></div>';
            card.innerHTML = html;
            card.querySelector('.lp-title').textContent = data.title;
            card.querySelector('.lp-snippet').textContent = data.snippet;
        }

        function position(link) {
            var rect = link.getBoundingClientRect();
            var margin = 10;
            var cardWidth = card.offsetWidth || 300;
            var left = rect.left;
            if (left + cardWidth > window.innerWidth - margin) left = window.innerWidth - cardWidth - margin;
            if (left < margin) left = margin;
            var top = rect.bottom + 8;
            var cardHeight = card.offsetHeight || 160;
            if (top + cardHeight > window.innerHeight - margin && rect.top - cardHeight - 8 > margin) {
                top = rect.top - cardHeight - 8;
            }
            card.style.left = left + 'px';
            card.style.top = top + 'px';
        }

        function hide() {
            card.classList.remove('visible');
            activeKey = null;
        }

        function showFor(link, key) {
            var data = cache[key];
            if (!data || data === 'missing') return;
            render(data);
            position(link);
            card.classList.add('visible');
            requestAnimationFrame(function () { position(link); });
        }

        function handleEnter(link, key) {
            clearTimeout(hideTimer);
            clearTimeout(showTimer);
            activeKey = key;
            showTimer = setTimeout(function () {
                if (activeKey !== key) return;
                if (cache[key] === 'missing') return;
                if (cache[key]) { showFor(link, key); return; }
                fetch(key, { credentials: 'same-origin' }).then(function (res) {
                    if (!res.ok) { cache[key] = 'missing'; return null; }
                    return res.text();
                }).then(function (html) {
                    if (html == null) return;
                    var data = extract(html);
                    if (!data) { cache[key] = 'missing'; return; }
                    cache[key] = data;
                    if (activeKey === key) showFor(link, key);
                }).catch(function () { cache[key] = 'missing'; });
            }, 350);
        }

        function handleLeave() {
            clearTimeout(showTimer);
            activeKey = null;
            hideTimer = setTimeout(hide, 200);
        }

        card.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
        card.addEventListener('mouseleave', function () { hideTimer = setTimeout(hide, 150); });

        content.querySelectorAll('a[href]').forEach(function (link) {
            var href = link.getAttribute('href');
            if (!href || href.charAt(0) === '#') return;
            if (/^(mailto:|javascript:|tel:)/i.test(href)) return;
            if (link.hostname !== window.location.hostname) return;
            var key = stripHash(link.href);
            if (!/\.html?$/i.test(key.split('?')[0])) return;
            link.addEventListener('mouseenter', function () { handleEnter(link, key); });
            link.addEventListener('mouseleave', handleLeave);
            link.addEventListener('focus', function () { handleEnter(link, key); });
            link.addEventListener('blur', handleLeave);
        });

        window.addEventListener('scroll', hide, { passive: true });
        window.addEventListener('resize', hide);
    })();
    </script>

    <!-- TOC sidebar: pulls the vimwiki-generated "Contents" block (a heading
         immediately followed by a list of same-page "#..." links — that's how
         :VimwikiTOC renders) out of the normal reading flow and rebuilds it as
         a left-hand sidebar, Wikipedia-style. Everything else that was in
         #content gets wrapped into #article-body next to it. If a page has no
         such block, this does nothing and the page renders exactly as before.
         Must run after the hover-preview script above (so that script still
         walks the original, unmodified #content), and before the numbered
         pipeline below, since step 1 (TikZ) looks for pre.tikz wherever it
         ends up nested and doesn't care about this move. -->
    <script>
    (function () {
        var DESKTOP_BREAKPOINT = 901; // must match the CSS media query below
        if (window.innerWidth < DESKTOP_BREAKPOINT) return; // phones/narrow: leave the page 100% untouched, exactly as before this feature existed

        var contentEl = document.getElementById('content');
        if (!contentEl) return;

        var kids = Array.prototype.slice.call(contentEl.children).filter(function (el) {
            return el.id !== 'breadcrumb';
        });
        if (!kids.length) return;

        // Find "<heading-bearing element> immediately followed by <ul of only
        // same-page links>". Vimwiki wraps every heading in its own
        // <div id="..."><h1 class="header">...</h1></div>, and specifically
        // marks the auto-generated Contents block with class="toc" on that
        // wrapper div — so a heading can be the element itself (a bare
        // <h1>-<h6>) or that wrapper div containing one. TOC links are
        // relative same-page links like "PageName.html#fragment", not bare
        // "#fragment", so anchors are matched by "has a # with a valid
        // in-page id after it" rather than "starts with #".
        function directHeading(el) {
            if (/^H[1-6]$/.test(el.tagName)) return el;
            for (var j = 0; j < el.children.length; j++) {
                if (/^H[1-6]$/.test(el.children[j].tagName)) return el.children[j];
            }
            return null;
        }
        function fragmentId(href) {
            var hashIdx = href.indexOf('#');
            return hashIdx === -1 ? '' : href.slice(hashIdx + 1);
        }

        var tocHeading = null, tocList = null, tocLabel = '';
        for (var i = 0; i < kids.length - 1; i++) {
            var el = kids[i], next = kids[i + 1];
            if (next.tagName !== 'UL') continue;
            var heading = directHeading(el);
            if (!heading) continue;
            var anchors = next.querySelectorAll('a[href]');
            if (!anchors.length) continue;
            var allSamePage = Array.prototype.every.call(anchors, function (a) {
                var id = fragmentId(a.getAttribute('href') || '');
                return !!id && document.getElementById(id) != null;
            });
            if (!allSamePage) continue;
            var isTocMarked = !!(el.classList && el.classList.contains('toc'));
            var isContentsLabel = heading.textContent.replace(/\s+/g, ' ').trim().toLowerCase() === 'contents';
            if (tocHeading === null || isTocMarked || isContentsLabel) {
                tocHeading = el;
                tocList = next;
                tocLabel = heading.textContent.replace(/\s+/g, ' ').trim();
                if (isTocMarked || isContentsLabel) break;
            }
        }
        if (!tocHeading || !tocList) return; // no TOC on this page — leave layout untouched
        tocLabel = tocLabel || 'Contents';
        document.body.classList.add('has-toc-sidebar'); // see the matching @media rule — reclaims the left margin next to the sidebar

        tocHeading.parentNode.removeChild(tocHeading);
        tocList.parentNode.removeChild(tocList);
        tocList.removeAttribute('id');
        tocList.className = (tocList.className + ' toc-sidebar-list').trim();

        // Vimwiki prefixes each TOC entry's visible text with "#" (e.g.
        // "#Definition") — strip that from the sidebar's display text only;
        // the href is untouched, so the link still points to the right place.
        Array.prototype.forEach.call(tocList.querySelectorAll('a'), function (a) {
            if (a.textContent.charAt(0) === '#') {
                a.textContent = a.textContent.slice(1);
            }
        });

        var sidebar = document.createElement('aside');
        sidebar.id = 'toc-sidebar';
        sidebar.setAttribute('aria-label', tocLabel);
        var label = document.createElement('div');
        label.className = 'toc-sidebar-title';
        label.textContent = tocLabel;
        label.title = 'Drag to move';
        sidebar.appendChild(label);
        sidebar.appendChild(tocList);

        // ---- Sidebar's own width: small square handles directly on the box
        // (bottom-right corner + a taller easier-to-grab handle on the
        // middle of its right edge), PowerPoint/picture-style, rather than
        // a big strip elsewhere on the page. Works whether the box is
        // docked (flex-basis) or floating (width) — see applyWidth below.
        var MIN_SIDEBAR = 160, MAX_SIDEBAR = 480, DEFAULT_SIDEBAR = 240;
        var WIDTH_KEY = 'wikiTocSidebarWidth';

        function clampWidth(w) { return Math.max(MIN_SIDEBAR, Math.min(MAX_SIDEBAR, w)); }
        var currentWidth = DEFAULT_SIDEBAR; // tracked directly — no need to re-derive it from live layout
        function applyWidth(w) {
            currentWidth = w;
            sidebar.style.flexBasis = w + 'px';
            sidebar.style.maxWidth = w + 'px';
            sidebar.style.width = w + 'px'; // authoritative once floating (position:fixed ignores flex-basis)
        }
        function persistWidth() {
            try { localStorage.setItem(WIDTH_KEY, Math.round(currentWidth)); } catch (e) {}
        }
        try {
            var savedWidth = parseInt(localStorage.getItem(WIDTH_KEY), 10);
            applyWidth(!isNaN(savedWidth) ? clampWidth(savedWidth) : DEFAULT_SIDEBAR);
        } catch (e) {
            applyWidth(DEFAULT_SIDEBAR);
        }

        function makeSidebarHandle(extraClass) {
            var h = document.createElement('div');
            h.className = 'toc-resize-handle ' + extraClass;
            h.setAttribute('role', 'separator');
            h.setAttribute('aria-orientation', 'vertical');
            h.setAttribute('aria-label', 'Resize contents box');
            h.setAttribute('aria-valuemin', String(MIN_SIDEBAR));
            h.setAttribute('aria-valuemax', String(MAX_SIDEBAR));
            h.tabIndex = 0;
            sidebar.appendChild(h);

            var dragging = false, startX = 0, startWidth = 0;
            h.addEventListener('pointerdown', function (e) {
                dragging = true;
                startX = e.clientX;
                startWidth = currentWidth;
                h.classList.add('dragging');
                document.body.classList.add('toc-resizing');
                try { h.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });
            h.addEventListener('pointermove', function (e) {
                if (!dragging) return;
                applyWidth(clampWidth(startWidth + (e.clientX - startX)));
                h.setAttribute('aria-valuenow', String(Math.round(currentWidth)));
                requestFitContent(); // sidebar just grew/shrank — #content may need to yield room
            });
            function end(e) {
                if (!dragging) return;
                dragging = false;
                h.classList.remove('dragging');
                document.body.classList.remove('toc-resizing');
                try { h.releasePointerCapture(e.pointerId); } catch (err) {}
                persistWidth();
            }
            h.addEventListener('pointerup', end);
            h.addEventListener('pointercancel', end);
            // Safety net: if pointerup/pointercancel never reach the handle
            // itself — e.g. the window loses focus mid-drag, which is
            // exactly what happens when the OS's own window-resize drag
            // takes over — the drag would otherwise get stuck forever: the
            // resize cursor and disabled text-selection are applied to
            // <body>, so a stuck drag "stays and affects" the whole page,
            // not just this handle. end() is a no-op unless a drag is
            // actually in progress, so listening this broadly is harmless.
            window.addEventListener('pointerup', end);
            window.addEventListener('pointercancel', end);
            window.addEventListener('blur', end);
            h.addEventListener('dblclick', function () {
                applyWidth(DEFAULT_SIDEBAR);
                persistWidth();
                requestFitContent();
            });
            h.addEventListener('keydown', function (e) {
                var step = 20;
                if (e.key === 'ArrowLeft') { applyWidth(clampWidth(currentWidth - step)); persistWidth(); requestFitContent(); e.preventDefault(); }
                else if (e.key === 'ArrowRight') { applyWidth(clampWidth(currentWidth + step)); persistWidth(); requestFitContent(); e.preventDefault(); }
            });
            return h;
        }
        makeSidebarHandle('corner');
        makeSidebarHandle('edge');

        // Put the sidebar OUTSIDE #content — as a sibling to its left inside
        // a shared wrapper — rather than nesting it inside the card's own
        // padding/background. #content (with just the TOC removed) already
        // holds everything else, so it doubles as the "article" column
        // as-is; no separate wrapper needed for its contents.
        var pageShell = document.createElement('div');
        pageShell.id = 'page-shell';
        var contentParent = contentEl.parentNode;
        contentParent.insertBefore(pageShell, contentEl);
        pageShell.appendChild(sidebar);
        pageShell.appendChild(contentEl); // moves #content itself, doesn't clone it

        // ---- Big strip between the sidebar and #content: this now
        // controls the empty gap/margin in front of the ARTICLE, entirely
        // independent of the sidebar's own size (that's the two handles
        // above, on the box itself) — dragging this moves the main content
        // column, not the small contents box, matching how the mirrored
        // strip on the article's right edge already behaves.
        var MIN_GAP = 16, MAX_GAP = 400, DEFAULT_GAP = 24;
        var GAP_KEY = 'wikiContentLeftGap';

        var resizer = document.createElement('div');
        resizer.id = 'toc-resizer';
        resizer.setAttribute('role', 'separator');
        resizer.setAttribute('aria-orientation', 'vertical');
        resizer.setAttribute('aria-label', 'Resize space before the article');
        resizer.setAttribute('aria-valuemin', String(MIN_GAP));
        resizer.setAttribute('aria-valuemax', String(MAX_GAP));
        resizer.tabIndex = 0;
        var grip = document.createElement('div');
        grip.className = 'toc-resizer-grip';
        resizer.appendChild(grip);
        pageShell.insertBefore(resizer, contentEl); // sits between the sidebar and #content

        function clampGap(w) { return Math.max(MIN_GAP, Math.min(MAX_GAP, w)); }
        var currentGap = DEFAULT_GAP;
        function applyGap(w) {
            currentGap = w;
            resizer.style.flexBasis = w + 'px';
            resizer.style.maxWidth = w + 'px';
            resizer.setAttribute('aria-valuenow', String(Math.round(w)));
        }
        function persistGap() {
            try { localStorage.setItem(GAP_KEY, Math.round(currentGap)); } catch (e) {}
        }
        try {
            var savedGap = parseInt(localStorage.getItem(GAP_KEY), 10);
            applyGap(!isNaN(savedGap) ? clampGap(savedGap) : DEFAULT_GAP);
        } catch (e) {
            applyGap(DEFAULT_GAP);
        }

        var draggingGap = false, gapStartX = 0, gapStartWidth = 0;
        resizer.addEventListener('pointerdown', function (e) {
            draggingGap = true;
            gapStartX = e.clientX;
            gapStartWidth = currentGap;
            resizer.classList.add('dragging');
            document.body.classList.add('toc-resizing');
            try { resizer.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
        });
        resizer.addEventListener('pointermove', function (e) {
            if (!draggingGap) return;
            applyGap(clampGap(gapStartWidth + (e.clientX - gapStartX)));
            requestFitContent(); // gap just grew/shrank — #content may need to yield room
        });
        function endGapDrag(e) {
            if (!draggingGap) return;
            draggingGap = false;
            resizer.classList.remove('dragging');
            document.body.classList.remove('toc-resizing');
            try { resizer.releasePointerCapture(e.pointerId); } catch (err) {}
            persistGap();
        }
        resizer.addEventListener('pointerup', endGapDrag);
        resizer.addEventListener('pointercancel', endGapDrag);
        // Safety net — see the matching comment on the sidebar's own
        // resize handles above.
        window.addEventListener('pointerup', endGapDrag);
        window.addEventListener('pointercancel', endGapDrag);
        window.addEventListener('blur', endGapDrag);
        resizer.addEventListener('dblclick', function () {
            applyGap(DEFAULT_GAP);
            persistGap();
            requestFitContent();
        });
        resizer.addEventListener('keydown', function (e) {
            var step = 20;
            if (e.key === 'ArrowLeft') { applyGap(clampGap(currentGap - step)); persistGap(); requestFitContent(); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { applyGap(clampGap(currentGap + step)); persistGap(); requestFitContent(); e.preventDefault(); }
        });

        // ---- Drag-to-move: grab the "Contents" title to reposition the
        // whole sidebar anywhere on screen (left, down, wherever). Detaches
        // it from the sticky flex column into a freely-positioned floating
        // panel (position:fixed) the first time it's dragged; remembered
        // across page loads the same way the width above already is. The
        // sidebar's own corner/edge handles keep working the same way in
        // either state — applyWidth() writes to both flex-basis (docked)
        // and width (floating) — and the gap strip stays exactly where it
        // is, controlling the article's left margin regardless of whether
        // the box is currently docked or off floating somewhere else.
        // Double-clicking the title undoes the float and goes back to the
        // normal sticky-in-column layout.
        var POS_KEY = 'wikiTocSidebarPos';
        function floatAt(left, top) {
            left = Math.max(4, Math.min(window.innerWidth - 60, left));
            top = Math.max(4, Math.min(window.innerHeight - 60, top));
            sidebar.classList.add('floating');
            sidebar.style.position = 'fixed';
            sidebar.style.left = left + 'px';
            sidebar.style.top = top + 'px';
            sidebar.style.width = (currentWidth || DEFAULT_SIDEBAR) + 'px';
            sidebar.style.maxHeight = 'calc(100vh - ' + (top + 20) + 'px)';
            return { left: left, top: top };
        }
        function unfloat() {
            sidebar.classList.remove('floating');
            sidebar.style.position = '';
            sidebar.style.left = '';
            sidebar.style.top = '';
            sidebar.style.width = '';
            sidebar.style.maxHeight = '';
            try { localStorage.removeItem(POS_KEY); } catch (e) {}
        }
        try {
            var savedPos = JSON.parse(localStorage.getItem(POS_KEY));
            if (savedPos && typeof savedPos.left === 'number' && typeof savedPos.top === 'number') {
                floatAt(savedPos.left, savedPos.top);
            }
        } catch (e) {}

        var draggingTitle = false, titleStartX = 0, titleStartY = 0, boxStartLeft = 0, boxStartTop = 0;
        label.addEventListener('pointerdown', function (e) {
            draggingTitle = true;
            var rect = sidebar.getBoundingClientRect();
            titleStartX = e.clientX;
            titleStartY = e.clientY;
            boxStartLeft = rect.left;
            boxStartTop = rect.top;
            label.classList.add('dragging-title');
            document.body.classList.add('toc-dragging-position');
            try { label.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
        });
        label.addEventListener('pointermove', function (e) {
            if (!draggingTitle) return;
            floatAt(boxStartLeft + (e.clientX - titleStartX), boxStartTop + (e.clientY - titleStartY));
        });
        function endTitleDrag(e) {
            if (!draggingTitle) return;
            draggingTitle = false;
            label.classList.remove('dragging-title');
            document.body.classList.remove('toc-dragging-position');
            try { label.releasePointerCapture(e.pointerId); } catch (err) {}
            var rect = sidebar.getBoundingClientRect();
            try { localStorage.setItem(POS_KEY, JSON.stringify({ left: rect.left, top: rect.top })); } catch (err) {}
        }
        label.addEventListener('pointerup', endTitleDrag);
        label.addEventListener('pointercancel', endTitleDrag);
        // Safety net — see the matching comment on the sidebar's own
        // resize handles above.
        window.addEventListener('pointerup', endTitleDrag);
        window.addEventListener('pointercancel', endTitleDrag);
        window.addEventListener('blur', endTitleDrag);
        label.addEventListener('dblclick', unfloat);

        // ---- Show/hide toggle (top-right button): lets the reader hide the
        // Contents box entirely, and — importantly — showing it again always
        // snaps it back to the normal docked-on-the-left position rather
        // than wherever it might have been left floating. That makes this
        // button a reliable "fix the layout" control if the box has drifted
        // into an awkward floating spot, not just a show/hide switch.
        // Hidden by default in the HTML; only shown here, since it's only
        // meaningful on pages where a sidebar actually got built.
        var HIDDEN_KEY = 'wikiTocSidebarHidden';
        var toggleBtn = document.getElementById('btn-toc-toggle');
        if (toggleBtn) {
            toggleBtn.style.display = '';
            function setToggleLabel(hidden) {
                var text = hidden ? 'Show contents' : 'Hide contents';
                toggleBtn.title = text;
                toggleBtn.setAttribute('aria-label', text);
                toggleBtn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
            }
            function hideSidebar() {
                sidebar.style.display = 'none';
                resizer.style.display = 'none'; // also collapse the gap strip — otherwise hiding the box just leaves dead space where it was
                contentEl.style.maxWidth = '1200px'; // immediate fallback in case this runs before renderContentWidth() exists yet (see below); it recomputes this properly once it does, and keeps it in sync afterwards
                setToggleLabel(true);
                try { localStorage.setItem(HIDDEN_KEY, '1'); } catch (e) {}
                renderContentWidth();
            }
            function showSidebar() {
                sidebar.style.display = '';
                resizer.style.display = ''; // restore the gap strip too, at whatever width it was (untouched by hiding)
                contentEl.style.maxWidth = 'none'; // immediate fallback — see hideSidebar() above
                if (sidebar.classList.contains('floating')) unfloat(); // always land back on the left, not wherever it last floated
                setToggleLabel(false);
                try { localStorage.removeItem(HIDDEN_KEY); } catch (e) {}
                renderContentWidth();
            }
            toggleBtn.addEventListener('click', function () {
                if (sidebar.style.display === 'none') showSidebar(); else hideSidebar();
            });
            try {
                if (localStorage.getItem(HIDDEN_KEY) === '1') hideSidebar(); else setToggleLabel(false);
            } catch (e) {
                setToggleLabel(false);
            }
        }

        // ---- Right-edge resizer: drag to shrink #content from the right,
        // leaving an adjustable empty margin between it and the shell's edge
        // (the shell's default flex-start alignment means that space just
        // shows up as page background once #content stops auto-filling it).
        // Mirrors the sidebar resizer above; "null" means "let it auto-fill"
        // (the original, unmodified default) rather than any specific width.
        var MIN_CONTENT = 400, MAX_CONTENT = 1300;
        var CONTENT_WIDTH_KEY = 'wikiContentWidth';
        var contentResizer = document.createElement('div');
        contentResizer.id = 'content-resizer';
        contentResizer.setAttribute('role', 'separator');
        contentResizer.setAttribute('aria-orientation', 'vertical');
        contentResizer.setAttribute('aria-label', 'Resize content width');
        contentResizer.tabIndex = 0;
        var contentGrip = document.createElement('div');
        contentGrip.className = 'toc-resizer-grip';
        contentResizer.appendChild(contentGrip);
        pageShell.appendChild(contentResizer); // after #content — it's the last child

        function clampContentWidth(w) { return Math.max(MIN_CONTENT, Math.min(MAX_CONTENT, w)); }
        var contentCurrentWidth = null; // null = auto (flex:1 1 auto, the original default) — this
                                         // is the reader's PREFERRED width. The width actually
                                         // painted to the screen is computed by renderContentWidth()
                                         // below, which may shrink it further to fit the window; the
                                         // preference itself is never overwritten by that shrinking,
                                         // so it comes back as soon as there's room for it again.

        // Everything in the #page-shell flex row besides #content: the
        // sidebar and gap strip (only while docked and visible — hidden via
        // the Contents toggle, or floating, both take them out of the flow)
        // plus the content-resizer's own fixed-width handle.
        function fitReservedWidth() {
            var w = 24; // content-resizer's own box, always present
            var sidebarHidden = sidebar.style.display === 'none';
            if (!sidebarHidden && !sidebar.classList.contains('floating')) w += currentWidth;
            if (!sidebarHidden) w += currentGap;
            return w;
        }

        // Paints #content's actual width from the reader's preference and
        // whatever room is actually available right now, so a custom width
        // set on a wide screen can never overflow past the sidebar on a
        // narrower one — #content is always the one that gives way, never
        // the sidebar, so Contents can't be squeezed off the edge of the
        // window. Works the same whether the sidebar is currently shown or
        // hidden (hideSidebar()/showSidebar() below both call this too) —
        // the content-resizer stays draggable either way, it just has less
        // reserved space to share with once the sidebar's gone. See the
        // resize listener and the sidebar/gap drag handlers above, which
        // call this too whenever the available room changes.
        function renderContentWidth() {
            if (!contentResizer) return; // called before this section has run yet — hideSidebar()/showSidebar()'s own fallback below covers that case
            var sidebarHidden = sidebar.style.display === 'none';
            if (contentCurrentWidth === null) {
                contentEl.style.flex = '';
                // Hidden: cap at a normal reading width so #content recenters
                // symmetrically instead of stretching edge-to-edge across the
                // freed-up space. Shown: no cap — fills whatever's left next
                // to the sidebar.
                contentEl.style.maxWidth = sidebarHidden ? '1200px' : 'none';
                contentResizer.setAttribute('aria-valuenow', '');
                return;
            }
            var shellWidth = pageShell.getBoundingClientRect().width;
            if (!shellWidth) return; // not laid out yet
            var available = Math.max(shellWidth - fitReservedWidth(), 0);
            var w = Math.min(contentCurrentWidth, available);
            contentEl.style.flex = '0 0 ' + w + 'px';
            contentEl.style.maxWidth = w + 'px';
            contentResizer.setAttribute('aria-valuenow', String(Math.round(w)));
        }

        var fitTicking = false;
        function requestFitContent() {
            if (fitTicking) return;
            fitTicking = true;
            requestAnimationFrame(function () {
                fitTicking = false;
                renderContentWidth();
            });
        }
        window.addEventListener('resize', requestFitContent);

        function applyContentWidth(w) {
            contentCurrentWidth = w;
            renderContentWidth();
        }
        function persistContentWidth() {
            try {
                if (contentCurrentWidth === null) localStorage.removeItem(CONTENT_WIDTH_KEY);
                else localStorage.setItem(CONTENT_WIDTH_KEY, Math.round(contentCurrentWidth));
            } catch (e) {}
        }
        try {
            var savedContentWidth = parseInt(localStorage.getItem(CONTENT_WIDTH_KEY), 10);
            if (!isNaN(savedContentWidth)) applyContentWidth(clampContentWidth(savedContentWidth));
        } catch (e) {}

        var draggingContent = false, contentDragStartX = 0, contentDragStartWidth = 0;
        contentResizer.addEventListener('pointerdown', function (e) {
            draggingContent = true;
            contentDragStartX = e.clientX;
            contentDragStartWidth = contentCurrentWidth != null ? contentCurrentWidth : contentEl.getBoundingClientRect().width;
            contentResizer.classList.add('dragging');
            document.body.classList.add('toc-resizing');
            try { contentResizer.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
        });
        contentResizer.addEventListener('pointermove', function (e) {
            if (!draggingContent) return;
            applyContentWidth(clampContentWidth(contentDragStartWidth + (e.clientX - contentDragStartX)));
        });
        function endContentDrag(e) {
            if (!draggingContent) return;
            draggingContent = false;
            contentResizer.classList.remove('dragging');
            document.body.classList.remove('toc-resizing');
            try { contentResizer.releasePointerCapture(e.pointerId); } catch (err) {}
            persistContentWidth();
        }
        contentResizer.addEventListener('pointerup', endContentDrag);
        contentResizer.addEventListener('pointercancel', endContentDrag);
        // Safety net — see the matching comment on the sidebar's own
        // resize handles above.
        window.addEventListener('pointerup', endContentDrag);
        window.addEventListener('pointercancel', endContentDrag);
        window.addEventListener('blur', endContentDrag);
        contentResizer.addEventListener('dblclick', function () {
            applyContentWidth(null);
            persistContentWidth();
        });
        contentResizer.addEventListener('keydown', function (e) {
            var step = 20;
            var current = contentCurrentWidth != null ? contentCurrentWidth : contentEl.getBoundingClientRect().width;
            if (e.key === 'ArrowLeft') { applyContentWidth(clampContentWidth(current - step)); persistContentWidth(); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { applyContentWidth(clampContentWidth(current + step)); persistContentWidth(); e.preventDefault(); }
        });

        // ---- Scrollspy: highlight whichever section is currently being read ----
        var links = Array.prototype.slice.call(tocList.querySelectorAll('a[href]'));
        var map = {};       // heading id -> its sidebar <a>
        var headings = [];  // heading elements, in document order
        links.forEach(function (a) {
            var id = fragmentId(a.getAttribute('href') || '');
            if (!id) return;
            var target = document.getElementById(id);
            if (!target) return;
            map[id] = a;
            headings.push(target);
        });
        if (!headings.length) return;

        var activeLink = null;
        function setActive(id) {
            var link = id ? map[id] : null;
            if (link === activeLink) return;
            if (activeLink) activeLink.classList.remove('active');
            if (link) link.classList.add('active');
            activeLink = link;
        }

        var OFFSET = 100; // px from the top of the viewport that counts as "current"
        var ticking = false;
        function update() {
            ticking = false;
            var currentId = headings[0].id;
            for (var i = 0; i < headings.length; i++) {
                if (headings[i].getBoundingClientRect().top - OFFSET <= 0) {
                    currentId = headings[i].id;
                } else {
                    break;
                }
            }
            setActive(currentId);
        }
        function requestUpdate() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(update);
            }
        }
        window.addEventListener('scroll', requestUpdate, { passive: true });
        window.addEventListener('resize', requestUpdate);
        update();

        // Restructuring the DOM reflows the whole page (narrower column,
        // different wrapping), so if the browser already auto-scrolled to a
        // URL fragment (e.g. a link landing on "#Some Section") *before*
        // this script ran, that scroll position is now stale and points at
        // the wrong spot. Re-apply it against the new layout.
        if (window.location.hash) {
            var targetId = decodeURIComponent(window.location.hash.slice(1));
            var scrollTarget = document.getElementById(targetId);
            if (scrollTarget) scrollTarget.scrollIntoView();
        }
    })();
    </script>

    <!-- Mobile Contents toggle: a separate, self-contained script (own copy
         of the same TOC-detection logic as the desktop sidebar script above)
         that only ever runs below 900px — exactly where that script bails
         out — so the two are mutually exclusive on any given page load and
         can't interact with or break one another. Pulls the same
         auto-generated "Contents" block out of the reading flow and puts it
         behind a floating toggle button instead, opening a translucent
         "glass" panel (backdrop-filter blur) for jumping to a section. -->
    <script>
    (function () {
        var MOBILE_BREAKPOINT = 900; // must match the CSS media query above
        if (window.innerWidth > MOBILE_BREAKPOINT) return; // desktop/tablet: the sidebar script above handles it instead

        var contentEl = document.getElementById('content');
        if (!contentEl) return;

        var kids = Array.prototype.slice.call(contentEl.children).filter(function (el) {
            return el.id !== 'breadcrumb';
        });
        if (!kids.length) return;

        function directHeading(el) {
            if (/^H[1-6]$/.test(el.tagName)) return el;
            for (var j = 0; j < el.children.length; j++) {
                if (/^H[1-6]$/.test(el.children[j].tagName)) return el.children[j];
            }
            return null;
        }
        function fragmentId(href) {
            var hashIdx = href.indexOf('#');
            return hashIdx === -1 ? '' : href.slice(hashIdx + 1);
        }

        var tocHeading = null, tocList = null, tocLabel = '';
        for (var i = 0; i < kids.length - 1; i++) {
            var el = kids[i], next = kids[i + 1];
            if (next.tagName !== 'UL') continue;
            var heading = directHeading(el);
            if (!heading) continue;
            var anchors = next.querySelectorAll('a[href]');
            if (!anchors.length) continue;
            var allSamePage = Array.prototype.every.call(anchors, function (a) {
                var id = fragmentId(a.getAttribute('href') || '');
                return !!id && document.getElementById(id) != null;
            });
            if (!allSamePage) continue;
            var isTocMarked = !!(el.classList && el.classList.contains('toc'));
            var isContentsLabel = heading.textContent.replace(/\s+/g, ' ').trim().toLowerCase() === 'contents';
            if (tocHeading === null || isTocMarked || isContentsLabel) {
                tocHeading = el;
                tocList = next;
                tocLabel = heading.textContent.replace(/\s+/g, ' ').trim();
                if (isTocMarked || isContentsLabel) break;
            }
        }
        if (!tocHeading || !tocList) return; // no TOC on this page — leave it alone
        tocLabel = tocLabel || 'Contents';

        tocHeading.parentNode.removeChild(tocHeading);
        tocList.parentNode.removeChild(tocList);
        tocList.removeAttribute('id');

        // Same "#Definition" -> "Definition" cleanup as the desktop sidebar.
        Array.prototype.forEach.call(tocList.querySelectorAll('a'), function (a) {
            if (a.textContent.charAt(0) === '#') a.textContent = a.textContent.slice(1);
        });

        var toggle = document.createElement('button');
        toggle.id = 'toc-toggle';
        toggle.type = 'button';
        toggle.title = 'Browse sections';
        toggle.setAttribute('aria-label', 'Browse sections');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h16"/></svg>';

        var overlay = document.createElement('div');
        overlay.id = 'toc-overlay';

        var panel = document.createElement('div');
        panel.id = 'toc-panel';
        panel.setAttribute('role', 'dialog');
        panel.setAttribute('aria-label', tocLabel);

        var header = document.createElement('div');
        header.className = 'toc-panel-header';
        var titleEl = document.createElement('span');
        titleEl.textContent = tocLabel;
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'toc-panel-close';
        closeBtn.setAttribute('aria-label', 'Close');
        closeBtn.innerHTML = '&times;';
        header.appendChild(titleEl);
        header.appendChild(closeBtn);

        var body = document.createElement('nav');
        body.className = 'toc-panel-body';
        body.appendChild(tocList);

        panel.appendChild(header);
        panel.appendChild(body);

        document.body.appendChild(overlay);
        document.body.appendChild(panel);
        document.body.appendChild(toggle);

        function openPanel() {
            panel.classList.add('open');
            overlay.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
        }
        function closePanel() {
            panel.classList.remove('open');
            overlay.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        }
        toggle.addEventListener('click', function () {
            if (panel.classList.contains('open')) closePanel(); else openPanel();
        });
        closeBtn.addEventListener('click', closePanel);
        overlay.addEventListener('click', closePanel);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
        });
        // Jumping to a section closes the panel so it doesn't sit on top of
        // the very content the visitor just asked to see.
        Array.prototype.forEach.call(tocList.querySelectorAll('a'), function (a) {
            a.addEventListener('click', closePanel);
        });
    })();
    </script>

    <!-- 0. Repair asset paths (vimwiki-asset-path-fix).
         Vimwiki resolves {{...}} images and local:/file: links against the
         SOURCE wiki tree (.../phd_work/notes/vimwiki/...), which does not exist
         on the deployed site, and it appends ".html" to any [[link]] even when
         the target already has an extension. Both are repaired here so the
         fix survives every re-export instead of needing a manual patch. -->
    <script>
    (function () {
        var ROOT = '/wiki/vimwiki_html/';
        var NEEDLE = 'notes/vimwiki/';
        var ATTACH = /\.(pdf|png|jpe?g|gif|svg|webp|zip|txt|csv|tex|docx?|xlsx?|pptx?)\.html$/i;
        function fix(url) {
            if (!url || /^(https?:|mailto:|#|data:)/i.test(url)) return url;
            var i = url.indexOf(NEEDLE);
            if (i !== -1) url = ROOT + url.slice(i + NEEDLE.length);
            return url.replace(ATTACH, '.$1');
        }
        function sweep(sel, attr) {
            document.querySelectorAll(sel).forEach(function (el) {
                var v = el.getAttribute(attr), n = fix(v);
                if (n !== v) el.setAttribute(attr, n);
            });
        }
        sweep('a[href]', 'href');
        sweep('img[src]', 'src');
    })();
    </script>
    <!-- 1. Turn vimwiki {{{class="tikz"}}} blocks into TikZJax script tags (must run BEFORE tikzjax.js) -->
    <script>
        document.querySelectorAll('pre.tikz').forEach(function (pre) {
            var s = document.createElement('script');
            s.type = 'text/tikz';
            s.textContent = pre.textContent; // browser decodes HTML entities here
            pre.textContent = '';
            pre.appendChild(s); // keep <pre class="tikz"> as the container so its
                                 // text-align:center still applies to the SVG tikzjax inserts
        });
    </script>
    <!-- 2. Syntax-highlight code blocks, but skip diagram blocks -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/9.15.6/highlight.min.js"></script>
    <script type="text/javascript">
        document.querySelectorAll('pre:not(.mermaid):not(.tikz)').forEach(function (block) {
            hljs.highlightBlock(block);
        });
    </script>
    <!-- 3. TikZJax: renders <script type="text/tikz"> into SVG -->
    <script src="https://tikzjax.com/v1/tikzjax.js"></script>
    <!-- 4. Mermaid: renders <pre class="mermaid"> into SVG -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true });
    </script>

    <!-- 5. Ask-this-page search. Purely local: it indexes the text already in
         #content and shows the passages that match your question. The launcher
         is added to the .floating-btns stack above, so it inherits those styles.
         The index is built the first time the panel is opened, by which point
         MathJax/TikZ/Mermaid have finished rewriting the DOM. -->
    <script>
        window.PAGEBOT_CONFIG = {
            rootSelector: '#content',
            extraSkip: 'pre.mermaid, pre.tikz, .breadcrumb',
            launcherSelector: '.floating-btns',
            launcherLabel: '?',
            launcherTitle: 'Ask this page',
            title: 'Ask this page',
            accent: '#6b4f2a',
            panelBg: '#fbf6e9',
            results: 3
        };
    </script>
    <script src="/wiki/assets/pagebot.js"></script>

    <!-- 6. Site-wide search: separate from "Ask this page" above — this finds
         *which page* to go to, across the whole site, not just this one.
         Reads wiki/assets/search-index.json (built by build_search_index.py).
         The launcher is docked into the top-right stack, next to translate,
         since both are site-wide rather than per-page tools. -->
    <script>
        window.SEARCH_CONFIG = {
            launcherSelector: '.top-right-btns',
            launcherLabel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16.3 16.3 21 21"/></svg>',
            launcherTitle: 'Search this site',
            title: 'Search this site',
            accent: '#6b4f2a',
            panelBg: '#fbf6e9',
            maxResults: 8
        };
    </script>
    <script src="/wiki/assets/search.js"></script>

    <!-- search.js (just above) always inserts its own launcher button as the
         very first child of whatever container it's docked into — see its
         own "holder.insertBefore(docked, holder.firstChild)" — regardless
         of where #btn-home already sits. That insertion is itself deferred
         to DOMContentLoaded (search.js checks document.readyState, and at
         this point in the parse it's still "loading", not "complete"), so
         this script needs to defer the same way rather than run immediately
         — otherwise it fires before search.js has actually inserted
         anything and re-asserting home's position is a no-op. Deferring
         here also guarantees correct order: same-event listeners run in
         registration order, and search.js's listener was registered first
         (its script tag comes first), so its insertion always happens
         before this one re-asserts #btn-home in front of it. -->
    <script>
    (function () {
        function reorderHome() {
            var home = document.getElementById('btn-home');
            var stack = document.querySelector('.top-right-btns');
            if (home && stack && stack.firstChild !== home) {
                stack.insertBefore(home, stack.firstChild);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', reorderHome);
        } else {
            reorderHome();
        }
    })();
    </script>
</body>
</html>
